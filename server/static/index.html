.tw{overflow-x:auto}

/* ---------- the ladder (1v1 and 2v2 together) ----------
 Each finished game, oldest first:
   result points  win / draw / loss  (every player on the team)
 + played point   for every player in the game
 + upset bonus    for a win against a side ranked above you
                  (2v2: the teams' average ladder position just before the game;
                   players with no games yet count as ranked below everyone)
 Standings: points, then VP difference, then wins.                              */
function cmpRow(a,b){return b.pts-a.pts||(b.vf-b.va)-(a.vf-a.va)||b.w-a.w||a.name.localeCompare(b.name)}
function ladder(){
 if(LCACHE&&LCACHE.rev===S.rev)return LCACHE;
 const st=S.settings,r={},awards={},DAY=86400,NOW=S.server_time||Date.now()/1000;
 // Inactivity: every idle_days without a game (counted from a player's last game), lose points by ladder position at that moment.
 function applyIdle(until){
  const D=(st.idle_days||0)*DAY;if(!D)return;until=Math.min(until,NOW);
  for(;;){let who=null,at=1/0;Object.values(r).forEach(x=>{if(!x.last)return;const t=x.last+D*(x.idleN+1);if(t<at){at=t;who=x}});
   if(!who||at>until)break;
   const ranked=Object.values(r).filter(x=>x.gp>0).sort(cmpRow),pos=ranked.indexOf(who)+1;
   const amt=pos<=3?st.idle_top:pos<=6?st.idle_mid:st.idle_low,lose=Math.min(amt||0,who.pts);
   who.pts-=lose;who.idle+=lose;who.idleN++;}
 }
 S.players.forEach(p=>r[p.id]={id:p.id,name:p.name,fac:p.warband||p.faction,idle:0,idleN:0,last:0,pts:0,gp:0,w:0,d:0,l:0,up:0,vf:0,va:0,g1:0,g2:0,form:[]});
 S.games.filter(g=>g.status==="done"&&g.ladder!==false).sort((a,b)=>(a.finished||a.created)-(b.finished||b.created)).forEach(g=>{
  if(g.teams.flat().some(id=>!r[id]))return;
  applyIdle(g.finished||g.created);
  const ranked=Object.values(r).filter(x=>x.gp>0).sort(cmpRow),pos={};ranked.forEach((x,i)=>pos[x.id]=i+1);
  const avg=t=>t.reduce((n,id)=>n+(pos[id]||ranked.length+1),0)/t.length;
  const pa=avg(g.teams[0]),pb=avg(g.teams[1]),s=res(g),t=totals(g);
  awards[g.id]={};
  [[0,s,pb<pa],[1,1-s,pa<pb]].forEach(([i,sc,oppHigher])=>g.teams[i].forEach(id=>{
   const x=r[id],parts=[];
   if(sc===1){x.w++;x.form.push("W");parts.push(["Win",st.win])}else if(sc===0){x.l++;x.form.push("L");if(st.loss)parts.push(["Loss",st.loss])}else{x.d++;x.form.push("D");parts.push(["Draw",st.draw])}
   if(st.play)parts.push(["Played",st.play]);
   if(sc===1&&oppHigher&&st.upset){parts.push(["Upset",st.upset]);x.up++}
   const tot=parts.reduce((n,p)=>n+p[1],0);x.pts+=tot;x.gp++;g.mode==="2v2"?x.g2++:x.g1++;
   x.vf+=t[i];x.va+=t[1-i];awards[g.id][id]={tot,parts,upset:sc===1&&oppHigher};
  }));
  g.teams.flat().forEach(id=>{r[id].last=g.finished||g.created;r[id].idleN=0});
 });
 applyIdle(1/0);
 const rows=Object.values(r).sort((a,b)=>(b.gp>0)-(a.gp>0)||cmpRow(a,b));
 LCACHE={rev:S.rev,rows,awards,byId:r};return LCACHE;
}
function recentOpps(pid,n){return doneGames().filter(g=>inGame(g,pid)).slice(0,n).flatMap(g=>g.teams.find(t=>!t.includes(pid)))}
function factionStats(){const f={};S.games.filter(g=>g.status==="done").forEach(g=>{const s=res(g);g.teams.forEach((t,i)=>t.forEach(pid=>{const n=ui.statBy==="warband"?gWb(g,pid):gFac(g,pid);if(!n)return;f[n]=f[n]||{n,g:0,w:0,d:0};f[n].g++;const sc=i?1-s:s;if(sc===1)f[n].w++;if(sc===.5)f[n].d++}))});return Object.values(f).sort((a,b)=>b.g-a.g)}

/* ---------- match-up suggestions (points-based) ---------- */
function pairCost(a,b,L,recent){let c=Math.abs(L[a].pts-L[b].pts);if((recent[a]||[]).includes(b))c+=10;return c}
function suggest1v1(ids){
 const L=ladder().byId,recent={};ids.forEach(id=>recent[id]=recentOpps(id,3));
 const list=ids.slice(),BYE="__bye";if(list.length%2)list.push(BYE);
 const n=list.length;
 if(n>20){const o=ids.slice().sort((a,b)=>L[b].pts-L[a].pts),out=[];while(o.length>1){const a=o.shift();let bi=0,bc=1e9;o.forEach((b,i)=>{const c=pairCost(a,b,L,recent);if(c<bc){bc=c;bi=i}});out.push([a,o.splice(bi,1)[0]])}return{pairs:out,out:o}}
 const memo=new Map();
 function best(mask){if(mask===(1<<n)-1)return{c:0,p:[]};if(memo.has(mask))return memo.get(mask);
  let i=0;while(mask&(1<<i))i++;let bestR={c:Infinity,p:[]};
  for(let j=i+1;j<n;j++){if(mask&(1<<j))continue;const a=list[i],b=list[j];const c=(a===BYE||b===BYE)?0:pairCost(a,b,L,recent);
   const rest=best(mask|(1<<i)|(1<<j));if(c+rest.c<bestR.c)bestR={c:c+rest.c,p:[[a,b],...rest.p]}}
  memo.set(mask,bestR);return bestR}
 const b=best(0);return{pairs:b.p.filter(p=>!p.includes(BYE)),out:b.p.filter(p=>p.includes(BYE)).flat().filter(x=>x!==BYE)};
}
function suggest2v2(ids){
 const L=ladder().byId,o=ids.slice().sort((a,b)=>L[b].pts-L[a].pts),games=[];
 while(o.length>=4){const g=o.splice(0,4);const splits=[[[g[0],g[3]],[g[1],g[2]]],[[g[0],g[2]],[g[1],g[3]]],[[g[0],g[1]],[g[2],g[3]]]];
  let best=null,bd=1e9;splits.forEach(s=>{const d=Math.abs(s[0].reduce((n,x)=>n+L[x].pts,0)-s[1].reduce((n,x)=>n+L[x].pts,0));if(d<bd){bd=d;best=s}});games.push(best)}
 return{games,out:o};
}

const SPR_CACHE={};
// Anime pixel-chibi character builder for the Spearhead League app.
// Draws an original 32x40 character from a spec, then adds soft shading and a coloured outline.
function chibiGrid(sp){
 const W=32,H=40,g=[];for(let y=0;y<H;y++)g.push(new Array(W).fill(null));
 const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
 const set=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&x<W&&y>=0&&y<H&&c)g[y][x]=typeof c==="string"?hx(c):c};
 const rect=(x0,y0,x1,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,c)};
 const ell=(cx,cy,rx,ry,c,ok)=>{for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const d=((x-cx)/rx)**2+((y-cy)/ry)**2;if(d<=1&&(!ok||ok(x,y)))set(x,y,c)}};

function roundGrid(g,editable){const t=totals(g);

function vNew(){
 if(!isPlayer())return`<div class="card empty">Choose your name first to start a game.<br><br><a class="btn pri" href="#welcome">I'm playing</a></div>`;

 const mode=ui.newMode,me=ME.pid;
 const slot=(id,key,label)=>`<div class="slot"><label class="lb">${label}</label><select id="s-${key}" data-keep data-ch="slot" data-v="${key}">${plOpts(id)}</select><select id="w-${key}" data-keep>${wbOpts(id?pWb(id):"")}</select></div>`;
 const A=mode==="1v1"?[slot(me,"a0","You")]:[slot(me,"a0","You"),slot("","a1","Teammate")];

 <div><h3 style="margin-top:0">${mode==="2v2"?"Team B":"Side B"}</h3><div style="display:grid;gap:8px">${B.join("")}</div></div></div>
 ${mode==="2v2"?`<p class="small muted">2v2: each team scores one combined VP total per round. Every player on the winning team gets the win points.</p>`:""}

 ${ui.finalOnly?`<div class="row" style="margin-top:10px"><span class="grow">Final VP</span><input type="number" id="n-va" data-keep placeholder="A"> – <input type="number" id="n-vb" data-keep placeholder="B"></div>`:""}
 <details style="margin-top:12px"><summary class="small" style="cursor:pointer;color:var(--gold2)">＋ Add a player who isn't on the list (no phone)</summary>

 <button class="btn" data-act="addOther">Add to ladder</button></div></details>
 <div class="row" style="margin-top:14px"><a class="btn" href="#ladder">Cancel</a><button class="btn pri grow" data-act="startGame">${ui.finalOnly?"Save result":"Start live game"}</button></div></div>`;

function vMatch(){
 const here=JSON.parse(ls.get(HERE_KEY)||"[]").filter(id=>P(id));
 const busy=new Set(liveGames().flatMap(g=>g.teams.flat()));
 let out="";
 if(ui.sug){
  const s=ui.sug;
  if(s.mode==="1v1")out=`<div class="card"><h2>Suggested 1v1 match-ups</h2>${s.pairs.length?s.pairs.map(([a,b])=>sugRow([a],[b])).join(""):`<div class="empty">Need at least two players.</div>`}${s.out.length?`<p class="small muted">${esc(s.out.map(pn).join(", "))} — odd one out: join a 2v2 or play the winner.</p>`:""}</div>`;
  else out=`<div class="card"><h2>Suggested 2v2 games</h2>${s.games.length?s.games.map(([a,b])=>sugRow(a,b)).join(""):`<div class="empty">Need at least four players for 2v2.</div>`}${s.out.length?`<p class="small muted">Left over: ${esc(s.out.map(pn).join(", "))} — try a 1v1.</p>`:""}</div>`;
 }
 return`<div class="card"><h2>Who's here tonight?</h2><p class="small muted" style="margin-top:0">Tick who's playing for suggested match-ups — close on points, avoiding recent rematches. Only suggestions: anyone can still play anyone from the Ladder.</p>
 <div class="chk">${players().map(p=>`<label><input type="checkbox" class="here" value="${p.id}" ${here.includes(p.id)?"checked":""} data-ch="here">${esc(p.name)}${busy.has(p.id)?' <span class="pill live">live</span>':""}</label>`).join("")}</div>
 <div class="row" style="margin-top:12px"><button class="btn pri" data-act="sug" data-v="1v1">Suggest 1v1s</button><button class="btn pri" data-act="sug" data-v="2v2">Suggest 2v2s</button><button class="btn sm" data-act="hereAll">All</button><button class="btn sm" data-act="hereNone">None</button></div></div>${out}`;
}
function sugRow(A,B){const L=ladder().byId,pt=t=>t.reduce((n,x)=>n+L[x].pts,0);
 return`<div class="sug"><div class="r">${A.map(id=>mini(pFac(id),28)).join("")}<br><b>${esc(tn(A))}</b><div class="fac">${pt(A)} pts</div></div><span class="vs">VS</span><div>${B.map(id=>mini(pFac(id),28,"flip")).join("")}<br><b>${esc(tn(B))}</b><div class="fac">${pt(B)} pts</div></div>${isPlayer()?`<button class="btn sm pri" data-act="startSug" data-v="${A.join(",")}|${B.join(",")}">Start</button>`:"<span></span>"}</div>`}
function vHistory(){
 const f=ui.hist,gs=doneGames().filter(g=>f==="all"||g.mode===f),aw=ladder().awards;
 return`<div class="card"><div class="row between"><h2 style="margin:0">Results</h2><div class="seg">${["all","1v1","2v2"].map(m=>`<button data-act="hist" data-v="${m}" class="${f===m?"on":""}">${m==="all"?"All":m}</button>`).join("")}</div></div>
 ${gs.length?gs.map(g=>{const t=totals(g),a=aw[g.id],w=t[0]>t[1]?0:t[1]>t[0]?1:null;return`<a class="lg" href="#game/${g.id}"><div class="row between"><div class="duel">${g.teams[0].map(id=>mini(gFac(g,id),26,w===1?"ko":"")).join("")}${g.teams[1].map(id=>mini(gFac(g,id),26,"flip "+(w===0?"ko":""))).join("")}</div><div class="grow"><span class="pill">${g.mode}</span> <span class="small muted">${fdate(g.finished)}</span>${g.ladder===false?' <span class="pill">not ranked</span>':""}
  <div style="margin-top:4px"><span class="${t[0]>t[1]?"win":""}">${esc(tn(g.teams[0]))}</span> <span class="muted">vs</span> <span class="${t[1]>t[0]?"win":""}">${esc(tn(g.teams[1]))}</span></div>
  ${(()=>{const fa=g.teams.map(t=>t.map(id=>gWb(g,id)||gFac(g,id)).filter(Boolean).join(" · "));return fa[0]||fa[1]?`<div class="fac">${esc(fa[0]||"?")} vs ${esc(fa[1]||"?")}</div>`:""})()}
  ${a?`<div class="aw">${g.teams.flat().map(id=>`<span>${esc(pn(id))} <b>+${a[id].tot}</b>${a[id].upset?" ★":""}</span>`).join("")}</div>`:""}</div><div class="score">${t[0]} – ${t[1]}</div></div></a>`}).join(""):sleepy("No finished games yet.")}</div>`;
}

 <div class="row"><select id="xw-fac">${facOpts("")}</select><input id="xw-name" class="grow" placeholder="Warband name"><button class="btn" data-act="addWb">Add</button></div></div>
